name: AI contributor contract

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Metadata-only validation: do not check out or execute untrusted fork code.
permissions:
  contents: read
  pull-requests: read

jobs:
  validate-contract:
    # Legacy PRs without a task-ID title are not retroactively blocked.
    if: startsWith(github.event.pull_request.title, '[WT-')
    runs-on: ubuntu-latest
    steps:
      - name: Verify assigned task, pinned brief and duplicate claims
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          title = os.environ.get("PR_TITLE", "")
          body = os.environ.get("PR_BODY", "")
          repository = os.environ["GH_REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          errors = []

          def field(label):
              match = re.search(r"(?im)^" + re.escape(label) + r":\s*(.+)$", body)
              if not match:
                  errors.append("Missing required field: " + label)
                  return None
              value = match.group(1).strip()
              if not value or value.startswith("<!--"):
                  errors.append("Incomplete field: " + label)
                  return None
              return value

          title_id = re.match(r"^\[(WT-\d+)\]", title)
          if not title_id:
              errors.append("PR title must start with [WT-###].")

          issue = field("Task issue")
          spec = field("Approved spec")
          for label in ["Scope", "Related PRs/duplicates", "Test evidence", "Handover", "Risks"]:
              field(label)

          issue_number = None
          if issue:
              number = re.match(r"^#(\d+)\b", issue)
              if not number:
                  errors.append("Task issue must start with a GitHub issue number (#31).")
              else:
                  issue_number = int(number.group(1))

          spec_match = None
          if spec:
              spec_match = re.fullmatch(
                  r"(prompts/[0-9]{3}-[a-z0-9-]+\.md)\s+@\s+([0-9a-fA-F]{40})",
                  spec
              )
              if not spec_match:
                  errors.append("Approved spec must be prompts/NNN-name.md @ FULL_40_CHARACTER_SHA.")

          def api_json(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + "/" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          if issue_number is not None:
              try:
                  task = api_json("issues/" + str(issue_number))
                  if title_id and title_id.group(1) not in task.get("title", ""):
                      errors.append("Task Issue title does not contain the PR's WT task ID.")
              except Exception as exc:
                  errors.append("Could not verify Task Issue: " + str(exc))
              try:
                  page = 1
                  while page <= 5:
                      prs = api_json("pulls?state=open&per_page=100&page=" + str(page))
                      if not prs:
                          break
                      for other in prs:
                          if other.get("number") == pr_number:
                              continue
                          match = re.search(
                              r"(?im)^Task issue:\s*#" + str(issue_number) + r"\b",
                              other.get("body") or ""
                          )
                          if match:
                              errors.append(
                                  "Duplicate task claim: PR #" + str(other["number"]) +
                                  " already references Issue #" + str(issue_number)
                              )
                      if len(prs) < 100:
                          break
                      page += 1
              except Exception as exc:
                  errors.append("Could not audit open PR claims: " + str(exc))

          if spec_match:
              path, sha = spec_match.groups()
              try:
                  api_json("contents/" + path + "?ref=" + sha)
              except Exception as exc:
                  errors.append("Approved spec file is not accessible at pinned SHA: " + str(exc))

          if errors:
              for error in errors:
                  print("::error::" + error.replace("\n", " "))
              sys.exit(1)

          print("External contributor contract verified for " + title_id.group(1))
          print("This check verifies metadata only; human review and fabrication checks still apply.")
          PY
