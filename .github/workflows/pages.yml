name: Deploy Crystal Forge to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage release assets
        run: |
          mkdir -p "_site/releases/$GITHUB_SHA"
          git archive HEAD | tar -x -C _site
          cp _site/*.js _site/*.css "_site/releases/$GITHUB_SHA/"
          sed "s|<head>|<head><base href=\"./releases/$GITHUB_SHA/\"><meta name=\"studio-release\" content=\"$GITHUB_SHA\">|" index.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
